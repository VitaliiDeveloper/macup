name: Release

# A version tag, pushed once CI has passed on main for that commit: builds the binary and attaches it to the release.
# Everything but the upload is tools/release.sh, which CI also runs on every pull request.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload to it
  actions: read     # find CI's run for the tagged commit

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the ancestry check below needs main's history
      - name: The tag is on main and CI passed there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          passed=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$passed" -gt 0 ] || { echo "::error::CI has not passed on main for $GITHUB_SHA; re-run this workflow once it has"; exit 1; }
      - name: Build, strip, sign, pack and check
        run: tools/release.sh dist "${GITHUB_REF_NAME#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # never replaces an asset: a rebuild has other bytes than the SHA-256 the formula and the bootstraps may already hold
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null | grep -q .; then
            echo "::error::$GITHUB_REF_NAME already has assets; delete them in the release to build them again"; exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "macup ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
